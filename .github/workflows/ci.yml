name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install package (core + imzML) and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[imzml]" --group test

      - name: Install R dependencies
        run: metavision-studio install-r-deps

      - name: Doctor
        run: metavision-studio doctor

      - name: Test (core; GUI tests run in the gui job)
        run: pytest -m "not gui" --cov=metavision_studio --cov-report=term-missing

  gui:
    name: gui (ubuntu, py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: tlambert03/setup-qt-libs@v1
      - name: Install package with the napari GUI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[napari,imzml]" --group gui-test
      - name: Widget tests on a virtual display
        uses: aganders3/headless-gui@v2
        with:
          run: pytest tests/widgets tests/workflows -v
